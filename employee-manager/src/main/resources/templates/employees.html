
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management System</title>

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-4 mb-5">

    <h2 class="mb-4">Employee Management System</h2>

    <!-- Success Message -->
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <span th:text="${successMessage}"></span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Close">
        </button>
    </div>

    <!-- Search Form -->
    <form th:action="@{/employees}"
          method="get"
          class="row g-3 mb-4">

        <div class="col-md-5">
            <input type="text"
                   name="keyword"
                   class="form-control"
                   placeholder="Search by employee name"
                   th:value="${keyword}">
        </div>

        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">
                Search
            </button>

            <a th:href="@{/employees}" class="btn btn-outline-dark">
                Reset
            </a>
        </div>
    </form>

    <!-- Add Employee Form -->
    <div class="card shadow-sm mb-4">

        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Add New Employee</h5>
        </div>

        <div class="card-body">

            <form th:action="@{/employees}"
                  th:object="${employee}"
                  method="post">

                <!-- Full Name -->
                <div class="mb-3">
                    <label for="fullName" class="form-label">
                        Full Name
                    </label>

                    <input type="text"
                           id="fullName"
                           th:field="*{fullName}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('fullName')} ? ' is-invalid' : ''"
                           placeholder="Enter full name">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('fullName')}"
                         th:errors="*{fullName}">
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           th:field="*{email}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? ' is-invalid' : ''"
                           placeholder="Enter email address">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('email')}"
                         th:errors="*{email}">
                    </div>
                </div>

                <!-- Phone -->
                <div class="mb-3">
                    <label for="phone" class="form-label">
                        Phone
                    </label>

                    <input type="text"
                           id="phone"
                           th:field="*{phone}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('phone')} ? ' is-invalid' : ''"
                           placeholder="Enter 10-digit phone number">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('phone')}"
                         th:errors="*{phone}">
                    </div>
                </div>

                <!-- Department -->
                <div class="mb-3">
                    <label for="department" class="form-label">
                        Department
                    </label>

                    <input type="text"
                           id="department"
                           th:field="*{department}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('department')} ? ' is-invalid' : ''"
                           placeholder="Enter department">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('department')}"
                         th:errors="*{department}">
                    </div>
                </div>

                <!-- Salary -->
                <div class="mb-3">
                    <label for="salary" class="form-label">
                        Salary
                    </label>

                    <input type="number"
                           id="salary"
                           step="0.01"
                           min="0.01"
                           th:field="*{salary}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('salary')} ? ' is-invalid' : ''"
                           placeholder="Enter salary">

                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('salary')}"
                         th:errors="*{salary}">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary">
                    Save Employee
                </button>

                <button type="reset" class="btn btn-secondary">
                    Clear Form
                </button>

            </form>
        </div>
    </div>

    <!-- Employee Table -->
    <div class="card shadow-sm">

        <div class="card-header bg-dark text-white">
            <h5 class="mb-0">Employee List</h5>
        </div>

        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-striped table-bordered table-hover align-middle">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Department</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>

                        <!-- Display Employees -->
                        <tr th:each="emp : ${listEmployees}">

                            <td th:text="${emp.id}"></td>
                            <td th:text="${emp.fullName}"></td>
                            <td th:text="${emp.email}"></td>
                            <td th:text="${emp.phone}"></td>
                            <td th:text="${emp.department}"></td>
                            <td th:text="${#numbers.formatDecimal(emp.salary, 1, 2)}"></td>

                            <td>
                                <!-- Edit Button -->
                                <a th:href="@{/employees/{id}/edit(id=${emp.id})}"
                                   class="btn btn-warning btn-sm mb-1">
                                    Edit
                                </a>

                                <!-- Delete Button -->
                                <form th:action="@{/employees/{id}/delete(id=${emp.id})}"
                                      method="post"
                                      class="d-inline">

                                    <button type="submit"
                                            class="btn btn-danger btn-sm mb-1"
                                            onclick="return confirm('Are you sure you want to delete this employee?')">
                                        Delete
                                    </button>
                                </form>
                            </td>

                        </tr>

                        <!-- No Employees Found -->
                        <tr th:if="${#lists.isEmpty(listEmployees)}">
                            <td colspan="7" class="text-center text-muted">
                                No employees found.
                            </td>
                        </tr>

                    </tbody>
                </table>

            </div>
        </div>
    </div>

    <!-- Bootstrap JavaScript for dismissible alerts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
